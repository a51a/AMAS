[project]
name = "amas"
version = "0.1.0"
description = "AMAS - Algorithm Management as a Service. Local-first recommendation experiment lab."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
amas = "app.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
